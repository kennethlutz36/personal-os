<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fb"><title>Personal OS</title></head><body style="margin:0;background:#f5f7fb"><div id="boot" style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;padding:32px;color:#445">Loading Personal OS…</div><script>(async()=>{const files=['app/part-0.txt','app/part-1.txt','app/part-2.txt','app/part-3.txt','app/part-4.txt'];const b=(await Promise.all(files.map(f=>fetch(f).then(r=>{if(!r.ok)throw new Error('Missing '+f);return r.text()})))).join('');const bin=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const html=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close();})().catch(e=>{document.getElementById('boot').textContent='Unable to load Personal OS: '+e.message;});</script></body></html>
