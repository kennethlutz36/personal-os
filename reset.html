<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Personal OS</title></head><body style="margin:0;background:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:#28344a"><main style="max-width:640px;margin:12vh auto;padding:28px"><h1 style="font-size:24px">Resetting Personal OS…</h1><p id="status" style="color:#6f7b8e;line-height:1.55">Clearing the old app cache and service worker.</p><button id="retry" style="display:none;border:0;border-radius:10px;background:#5c70ea;color:white;padding:10px 14px;font-weight:700">Open Personal OS</button></main><script>(async()=>{const s=document.getElementById('status'),b=document.getElementById('retry');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));}s.textContent='Reset complete. Opening a clean Personal OS session…';setTimeout(()=>location.replace('./?recovered=20260817-2008'),700);}catch(e){s.textContent='Reset completed with a browser warning. Click below to reopen Personal OS.';b.style.display='inline-block';b.onclick=()=>location.replace('./?recovered=20260817-2008');}})();</script></body></html>
